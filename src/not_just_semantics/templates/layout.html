<!doctype html>
<html>
    <head>
        {% block head %}
        <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" type= "text/css">
        <title>{% block title %}{% endblock %} - {{ site_title }}</title>
        {% endblock %}
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    </head>
    <body>
        <div id="container">
            <div id="header">
                <header class="">
                    <ul class="">
                        <li class="">
                            <a href="{{ url_for('main_page')}}">Browse WMN Sequences</a>
                        </li>
                        <li class="">
                            <a href="{{ url_for('about_page')}}">About</a>
                        </li>
                    </ul>
                </header>
            </div>
            <div id="content">
                {% block content %}
                {% endblock %}
            </div>
            <div id="footer">
                {% block footer %}
                &copy; Copyleft 2024 by <a href="#">unkown</a>.
                {% endblock %}
            </div>
        </div>
    </body>
</html>
