{% extends "portal/base.html" %}
{% block title %}Edit Prompt — {{ prompt.name }}{% endblock %}

{% block content %}
<div class="portal-experiment">

  <div class="portal-experiment-header">
    <a href="{{ url_for('portal.experiment', experiment_id=experiment.id) }}">&larr; {{ experiment.name }}</a>
    <h1>Edit Prompt</h1>
  </div>

  {% if error %}
  <p class="portal-error">{{ error }}</p>
  {% endif %}

  <form method="post" action="{{ url_for('portal.edit_prompt', experiment_id=experiment.id, prompt_id=prompt.id) }}">
    <div class="prompt-form-grid">

      <div class="prompt-form-left">
        <div class="form-field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required autofocus
            value="{{ prompt.name }}" placeholder="e.g. Candidate detection">
        </div>

        <div class="form-field">
          <label for="host">Host</label>
          <select id="host" name="host" required>
            <option value="" disabled selected>Loading hosts…</option>
          </select>
        </div>

        <div class="form-field">
          <label for="model">Model</label>
          <select id="model" name="model" required>
            <option value="" disabled selected>Select a host first</option>
          </select>
          <p id="model-error" class="portal-error" style="display:none"></p>
        </div>

        <div class="form-field">
          <label for="output_format">Output format</label>
          <select id="output_format" name="output_format">
            <option value="" {% if not prompt.output_format %}selected{% endif %}>None (free text)</option>
            <option value="simplified" {% if prompt.output_format == "simplified" %}selected{% endif %}>Simplified</option>
            <option value="annotated" {% if prompt.output_format == "annotated" %}selected{% endif %}>Annotated</option>
          </select>
        </div>

        <div class="form-field">
          <label for="temperature">Temperature <span class="field-hint">(optional)</span></label>
          <input type="number" id="temperature" name="temperature"
            min="0" max="2" step="0.05" placeholder="Model default"
            value="{{ prompt.temperature if prompt.temperature is not none else '' }}">
        </div>

        <div class="form-field">
          <label for="num_ctx">Context window <span class="field-hint">(optional)</span></label>
          <input type="number" id="num_ctx" name="num_ctx"
            min="512" step="512" placeholder="Model default"
            value="{{ prompt.num_ctx or '' }}">
        </div>
      </div>

      <div class="prompt-form-right">
        <div class="form-field">
          <label for="system_prompt">System prompt <span class="field-hint">(optional)</span></label>
          <textarea id="system_prompt" name="system_prompt" rows="4"
            placeholder="You are a linguistics researcher...">{{ prompt.system_prompt or '' }}</textarea>
        </div>

        <div class="form-field">
          <label for="prompt_text">Prompt template</label>
          <textarea id="prompt_text" name="prompt_text" rows="10" required
            placeholder="Use {dialogue} to insert the dialogue text.">{{ prompt.prompt_text }}</textarea>
          <p class="exp-hint">Available placeholders: <code>{dialogue}</code></p>
        </div>
      </div>

    </div>

    <div class="exp-actions" style="margin-top: 1.25rem">
      <button type="submit">Save changes</button>
      <a href="{{ url_for('portal.experiment', experiment_id=experiment.id) }}">Cancel</a>
    </div>
  </form>

</div>
{% endblock %}

{% block scripts %}
<script>
(() => {
  const hostSelect = document.getElementById("host");
  const modelSelect = document.getElementById("model");
  const modelError = document.getElementById("model-error");
  const savedHost = {{ prompt.host | tojson }};
  const savedModel = {{ prompt.model | tojson }};

  function setSelectState(select, message) {
    select.innerHTML = "";
    const opt = document.createElement("option");
    opt.value = ""; opt.disabled = true; opt.selected = true;
    opt.textContent = message;
    select.appendChild(opt);
  }

  function loadModels(hostUrl, preselectModel) {
    setSelectState(modelSelect, "Loading models…");
    modelError.style.display = "none";

    fetch(`{{ url_for('portal.api_models') }}?host=${encodeURIComponent(hostUrl)}`)
      .then(r => r.json())
      .then(data => {
        modelSelect.innerHTML = "";
        if (data.error) {
          modelError.textContent = `${data.url}: ${data.error}`;
          modelError.style.display = "";
          setSelectState(modelSelect, "Ollama unreachable");
        } else if (data.models.length === 0) {
          modelError.textContent = `Connected to ${data.url} but no models are installed.`;
          modelError.style.display = "";
          setSelectState(modelSelect, "No models found");
        } else {
          setSelectState(modelSelect, "Select a model");
          data.models.forEach(m => {
            const opt = document.createElement("option");
            opt.value = m; opt.textContent = m;
            modelSelect.appendChild(opt);
          });
          if (preselectModel && data.models.includes(preselectModel)) {
            modelSelect.value = preselectModel;
          }
        }
      })
      .catch(err => {
        modelError.textContent = `Request failed: ${err}`;
        modelError.style.display = "";
        setSelectState(modelSelect, "Error loading models");
      });
  }

  fetch("{{ url_for('portal.api_hosts') }}")
    .then(r => r.json())
    .then(data => {
      hostSelect.innerHTML = "";
      if (!data.hosts || data.hosts.length === 0) {
        setSelectState(hostSelect, "No hosts configured");
        return;
      }
      setSelectState(hostSelect, "Select a host");
      data.hosts.forEach(h => {
        const opt = document.createElement("option");
        opt.value = h.url; opt.textContent = h.label;
        hostSelect.appendChild(opt);
      });
      if (savedHost && data.hosts.some(h => h.url === savedHost)) {
        hostSelect.value = savedHost;
        loadModels(savedHost, savedModel);
      } else if (data.hosts.length === 1) {
        hostSelect.value = data.hosts[0].url;
        loadModels(data.hosts[0].url, savedModel);
      }
    })
    .catch(err => {
      setSelectState(hostSelect, `Error loading hosts: ${err}`);
    });

  hostSelect.addEventListener("change", () => {
    if (hostSelect.value) loadModels(hostSelect.value, null);
  });
})();
</script>
{% endblock %}
