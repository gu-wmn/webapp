<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} - NeWMe</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <span class="brand">NeWMe</span>
      {% if session.get('user') %}
      <nav class="site-nav">
        <a href="{{ url_for('portal.experiments_home') }}">Experiments</a>
        <form method="post" action="{{ url_for('portal.logout') }}" style="display:inline">
          <button type="submit" class="nav-logout">Log out</button>
        </form>
      </nav>
      {% endif %}
    </div>
  </header>

  <main class="page-wrap">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
