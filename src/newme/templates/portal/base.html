<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} - NeWMe</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <span class="brand">NeWMe</span>
      {% if session.get('user') %}
      <nav class="site-nav">
        <a href="{{ url_for('portal.experiments_home') }}">Experiments</a>
        <form method="post" action="{{ url_for('portal.logout') }}" style="display:inline">
          <button type="submit" class="nav-logout">Log out</button>
        </form>
      </nav>
      {% endif %}
    </div>
  </header>

  <main class="page-wrap">
    {% block content %}{% endblock %}
  </main>
  <button type="button" id="back-to-top" class="back-to-top-btn">Back to the top</button>
  {% block scripts %}{% endblock %}
  <script>
    function animateScrollToY(targetY, duration) {
      const startY = window.scrollY;
      const distance = targetY - startY;
      const startTime = performance.now();

      function step(now) {
        const t = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
        window.scrollTo(0, startY + distance * eased);
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function fastScrollTo(target, duration) {
      const marginTop = parseFloat(getComputedStyle(target).scrollMarginTop) || 0;
      const targetY = target.getBoundingClientRect().top + window.scrollY - marginTop;
      animateScrollToY(targetY, duration);
    }

    document.addEventListener("click", (event) => {
      // Only take over a plain left-click — ctrl/cmd/shift/middle-click
      // etc. should still open in a new tab/window exactly like a real
      // link, since that's what these now are.
      if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      const link = event.target.closest('a[href^="#"]');
      if (!link) return;
      const id = link.getAttribute("href").slice(1);
      if (!id) return;
      const target = document.getElementById(id);
      if (!target) return;

      event.preventDefault();
      fastScrollTo(target, 300);
      // pushState, not replaceState: this needs to be a real, distinct
      // history entry so the browser's own scroll restoration can return
      // to exactly where the page was before the click when the user hits
      // Back — replaceState collapses the click into the entry it came
      // from, so Back would skip over it entirely.
      history.pushState(null, "", "#" + id);

      target.classList.remove("flash-highlight");
      void target.offsetWidth; // restart the animation if clicked again quickly
      target.classList.add("flash-highlight");
      target.addEventListener(
        "animationend",
        () => target.classList.remove("flash-highlight"),
        { once: true }
      );
    });

    const backToTopBtn = document.getElementById("back-to-top");
    if (backToTopBtn) {
      window.addEventListener("scroll", () => {
        backToTopBtn.classList.toggle("visible", window.scrollY > 400);
      }, { passive: true });

      backToTopBtn.addEventListener("click", () => {
        animateScrollToY(0, 300);
        history.replaceState(null, "", location.pathname + location.search);
      });
    }
  </script>
</body>
</html>
