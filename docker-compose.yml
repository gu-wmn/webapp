services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: newme:latest
    ports:
      - "${NEWME_HOST_PORT:-8060}:8000"
    environment:
      NEWME_DATA_PATH: /data
      SECRET_KEY: ${SECRET_KEY:-change-me}
    volumes:
      - ./data:/data
    restart: unless-stopped
