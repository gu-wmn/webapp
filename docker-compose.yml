services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: newme:local
    ports:
      - "8000:8000"
    environment:
      NEWME_DATA_PATH: /data
      SECRET_KEY: ${SECRET_KEY:-change-me}
    volumes:
      - newme_data:/data
      - ./corpora:/data/corpora
    restart: unless-stopped

volumes:
  newme_data:
